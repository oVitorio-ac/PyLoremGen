[tool.poetry]
name = "pyloremgen"
version = "2.0.0"
description = "A Python library for generating Lorem Ipsum text."
authors = ["Vitório Augusto Cavalheiro"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/oVitorio-ac/pyloremGen/"
repository = "https://github.com/oVitorio-ac/pyloremGen/"

[tool.poetry.dependencies]
python = "^3.13.7"
reportlab = "4.2.*"

[tool.poetry.group.dev.dependencies]
black = "24.4.*"
isort = "*"
flake8 = "*"
pylint = "*"
pre-commit = "*"
detect-secrets = "1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py38']
skip-string-normalization = true


[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
